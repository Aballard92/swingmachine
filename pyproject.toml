[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swingmachine"
version = "0.1.0"
description = "Regime-filtered trend pullback continuation swing trading bot."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scipy>=1.12,<2",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "PyYAML>=6.0,<7",
  "SQLAlchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "httpx>=0.27,<1",
  "tenacity>=8.2,<10",
  "exchange-calendars>=4.5,<5",
  "structlog>=24.1,<26",
  "typer>=0.12,<1",
  "pyarrow>=16,<20",
  "duckdb>=1.0,<2",
]

[project.scripts]
swingmachine = "swingmachine.runtime:main"

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "hypothesis>=6.112,<7",
  "mypy>=1.10,<2",
  "ruff>=0.6,<1",
  "pandas-stubs>=2.2,<3",
  "types-PyYAML>=6.0,<7",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/swingmachine/runtime.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["swingmachine"]
strict = true
warn_unused_configs = true
