[mypy]
python_version = 3.11
mypy_path = src
strict = True
warn_unused_configs = True
# Bound CI to the explicitly listed typed-core modules. Imported legacy modules
# still provide type information, while their known strict debt remains outside
# this acceptance gate.
follow_imports = silent
files =
    src/swingmachine/modeling.py,
    src/swingmachine/enums.py,
    src/swingmachine/config.py,
    src/swingmachine/contracts.py,
    src/swingmachine/storage.py,
    src/swingmachine/run_history.py,
    src/swingmachine/runtime.py
